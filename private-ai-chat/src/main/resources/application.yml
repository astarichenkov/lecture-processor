server:
  port: ${CHAT_PORT:8081}
  address: ${CHAT_BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: private-ai-chat
  thymeleaf:
    cache: false

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${CHAT_MODEL:qwen3:1.7b}
    timeout: ${CHAT_TIMEOUT:2m}
    # CPU-only hosts: keep thinking off (qwen3:1.7b emits a clean answer).
    think: ${CHAT_THINK:false}
  security:
    api-key: ${CHAT_API_KEY:}
    # Only trust X-Forwarded-For behind a trusted reverse proxy; otherwise a
    # client could spoof it and bypass the per-client rate limit.
    trust-forwarded-for: ${CHAT_TRUST_FORWARDED_FOR:false}
  limits:
    rate-limit-per-minute: 5
    max-message-chars: 2000
    max-context-tokens: 4096
    max-output-tokens: 512
    max-history-messages: 8
    queue-capacity: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info

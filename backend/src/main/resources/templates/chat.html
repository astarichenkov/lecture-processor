<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Чат: ' + ${lecture.originalFilename}">Чат</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 900px; }
        textarea { width: 100%; height: 5rem; }
        .answer { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; }
        .sources { font-size: .9rem; color: #555; }
        .error { color: #b00020; }
    </style>
</head>
<body>
<h1 th:text="'Чат по лекции: ' + ${lecture.originalFilename}"></h1>
<a th:href="@{/lectures/{id}(id=${lecture.id})}">← К лекции</a>

<form th:attr="hx-post='/lectures/' + ${lecture.id} + '/chat'"
      hx-target="#answer" hx-swap="innerHTML">
    <input type="hidden" name="session" th:value="${sessionId}"/>
    <textarea name="question" maxlength="2000" placeholder="Задайте вопрос по лекции..." required></textarea>
    <button type="submit">Спросить</button>
</form>

<div id="answer">
    <p>Задайте вопрос. Ответ будет основан на найденных фрагментах лекции.</p>
</div>
</body>
</html>
